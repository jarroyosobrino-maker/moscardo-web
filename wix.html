<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario CDC Moscardó 2026/27</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --rojo:#9B1E1D; --rojo-cl:#B93231; --azul:#141B4D; --azul-cl:#232C6E;
  --papel:#FFFFFF; --fondo:#EFEDEA; --carta:#FFFFFF; --linea:#DAD5D0;
  --tinta:#141B4D; --texto:#2B2A33; --tenue:#7C7883;
  --win:#1B7A4B; --draw:#9A7212; --loss:#A62828;
  --sombra:0 1px 3px rgba(20,27,77,.10);
}
*{box-sizing:border-box}
body{margin:0; background:var(--fondo); color:var(--texto); font-family:Barlow,"Helvetica Neue",Arial,sans-serif; font-size:15.5px; line-height:1.45; -webkit-font-smoothing:antialiased}
h1,h2,h3,.arch{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}


.wrap{max-width:1060px; margin:0 auto; padding:20px 16px 28px}

/* Próximo partido */
.prox{background:var(--azul); color:#fff; border-radius:4px; overflow:hidden; box-shadow:var(--sombra); margin-bottom:26px}
.prox .tag{background:var(--rojo); padding:7px 18px; font-family:Archivo,Arial,sans-serif; font-weight:700;
  text-transform:uppercase; letter-spacing:.16em; font-size:11.5px}
.prox .cuerpo{padding:20px 22px 22px; display:flex; flex-wrap:wrap; align-items:center; gap:8px 26px}
.prox .jbig{font-family:Archivo,Arial,sans-serif; font-weight:800; font-size:44px; line-height:.9; color:#fff; opacity:.30}
.prox .quien{flex:1 1 260px}
.prox .quien b{display:block; font-family:Archivo,Arial,sans-serif; font-weight:700; font-size:clamp(21px,3.6vw,28px); text-transform:uppercase; line-height:1.1}
.prox .quien span{display:block; margin-top:4px; font-size:14.5px; color:#C9CCE6}

/* Marcador de temporada */
.stats{display:grid; grid-template-columns:repeat(7,1fr); background:var(--carta); border:1px solid var(--linea);
  border-radius:4px; overflow:hidden; box-shadow:var(--sombra)}
.stats div{padding:11px 6px 12px; text-align:center; border-right:1px solid var(--linea)}
.stats div:last-child{border-right:0; background:var(--rojo)}
.stats div:last-child dt{color:#fff; opacity:.8} .stats div:last-child dd{color:#fff}
.stats dt{margin:0; font-family:Archivo,Arial,sans-serif; font-size:11px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:var(--tenue)}
.stats dd{margin:2px 0 0; font-family:Archivo,Arial,sans-serif; font-weight:800; font-size:26px; line-height:1.05; color:var(--tinta); font-variant-numeric:tabular-nums}

.racha{display:flex; align-items:center; gap:9px; margin:16px 0 30px; flex-wrap:wrap}
.racha .lab{font-family:Archivo,Arial,sans-serif; font-size:11px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:var(--tenue)}
.dot{width:15px; height:15px; border-radius:50%; display:inline-block}
.dot.g{background:var(--win)} .dot.e{background:var(--draw)} .dot.p{background:var(--loss)}
.dot.vac{background:transparent; border:1.5px dashed var(--linea)}

/* Vueltas y meses */
.vt{font-size:15px; font-weight:800; font-family:Archivo,Arial,sans-serif; text-transform:uppercase; letter-spacing:.2em; color:var(--rojo);
  margin:34px 0 0; padding-bottom:9px; border-bottom:3px solid var(--rojo)}
.mes{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.18em; color:var(--tinta);
  grid-column:1/-1; margin:16px 0 0; display:flex; align-items:center; gap:10px}
.mes span{color:var(--tenue); font-weight:600}
.mes::after{content:""; flex:1; height:1px; background:var(--linea)}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(208px,1fr)); gap:12px; align-items:stretch}

/* Tarjeta de partido */
.match{background:var(--carta); border:1px solid var(--linea); border-top:3px solid var(--azul);
  border-radius:3px; padding:11px 13px 12px; box-shadow:var(--sombra); display:flex; flex-direction:column; gap:9px}
.match.jugado.g{border-top-color:var(--win)}
.match.jugado.e{border-top-color:var(--draw)}
.match.jugado.p{border-top-color:var(--loss)}
.match > header{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.jn{font-family:Archivo,Arial,sans-serif; font-weight:800; font-size:12px; letter-spacing:.06em; color:var(--rojo)}
.fch{font-family:Archivo,Arial,sans-serif; font-weight:600; font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--tenue); font-variant-numeric:tabular-nums}
.chip{margin-left:auto; font-family:Archivo,Arial,sans-serif; font-size:9.5px; font-weight:700; letter-spacing:.11em;
  text-transform:uppercase; padding:3px 7px 2px; border-radius:2px; white-space:nowrap}
.chip.casa{background:var(--rojo); color:#fff}
.chip.fuera{background:transparent; color:var(--tenue); border:1px solid var(--linea)}

.enfr{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px}
.eq{font-family:Archivo,Arial,sans-serif; font-weight:600; font-size:13px; line-height:1.2; color:var(--texto); text-wrap:balance}
.eq:last-child{text-align:right}
.eq.mio{font-weight:800; color:var(--tinta)}
.marc{display:flex; align-items:center; gap:5px; padding:2px 9px; background:var(--fondo); border-radius:3px}
.marc .n{font-family:Archivo,Arial,sans-serif; font-weight:800; font-size:21px; line-height:1; font-variant-numeric:tabular-nums; color:var(--tinta)}
.marc .sep{color:var(--tenue); font-size:13px}
.marc .pend{font-family:Archivo,Arial,sans-serif; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--tenue)}
.jugado.g .marc .n{color:var(--win)} .jugado.e .marc .n{color:var(--draw)} .jugado.p .marc .n{color:var(--loss)}

.match > footer{border-top:1px solid var(--linea); padding-top:7px; margin-top:auto}
.hset{font-family:Archivo,Arial,sans-serif; font-weight:700; font-size:13px; color:var(--tinta); font-variant-numeric:tabular-nums}
.hpend{font-size:12px; color:var(--tenue)}
.gol{margin:3px 0 0; font-size:12.5px; color:var(--tenue); font-style:italic}

.pie{margin-top:34px; padding-top:18px; border-top:1px solid var(--linea); font-size:13px; color:var(--tenue); line-height:1.6}
.pie p{margin:0 0 7px} .pie b{color:var(--texto)}
/* Clasificación */
.clas{margin-bottom:28px}
.vt-clas{margin-top:0}
.clas-wrap{overflow-x:auto; background:var(--carta); border:1px solid var(--linea); border-top:0;
  border-radius:0 0 3px 3px; box-shadow:var(--sombra)}
.clas table{width:100%; border-collapse:collapse; min-width:520px; font-variant-numeric:tabular-nums}
.clas th{font-family:Archivo,Arial,sans-serif; font-weight:700; font-size:10.5px; letter-spacing:.11em;
  text-transform:uppercase; color:#fff; background:var(--azul); padding:8px 6px; text-align:center; white-space:nowrap}
.clas td{padding:6px; text-align:center; font-size:13.5px; border-bottom:1px solid var(--linea)}
.clas tr:last-child td{border-bottom:0}
.clas th.equipo, .clas td.equipo{text-align:left; font-family:Archivo,Arial,sans-serif; font-weight:600;
  font-size:13px; padding-left:10px; white-space:nowrap}
.clas th.pos, .clas td.pos{width:34px; color:var(--tenue); font-size:12px}
.clas td.pt{font-family:Archivo,Arial,sans-serif; font-weight:800; font-size:15px; color:var(--tinta)}
.clas td.dg{color:var(--tenue)}
.clas tr.asc td.pos{box-shadow:inset 3px 0 0 var(--win); color:var(--win); font-weight:700}
.clas tr.po td.pos{box-shadow:inset 3px 0 0 var(--azul-cl); color:var(--azul-cl); font-weight:700}
.clas tr.mio{background:var(--rojo-cl)}
.clas tr.mio td{color:#fff}
.clas tr.mio td.equipo{font-weight:800}
.clas tr.mio td.pt, .clas tr.mio td.dg{color:#fff}
.clas tr.mio.asc td.pos, .clas tr.mio.po td.pos{color:#fff}
.leyenda{margin:9px 2px 0; font-size:12px; color:var(--tenue); display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.key{width:11px; height:11px; border-radius:2px; display:inline-block}
.key.asc{background:var(--win)} .key.po{background:var(--azul-cl)}
@media (max-width:620px){
  .wrap{padding:16px 10px 24px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .stats div{border-bottom:1px solid var(--linea)}
  /* Dos partidos por fila en móvil */
  .grid{grid-template-columns:repeat(2,1fr); gap:9px}
  .match{padding:9px 10px 10px; gap:7px}
  .match > header{gap:5px}
  .jn{font-size:11px}
  .fch{font-size:10.5px; letter-spacing:.06em}
  .chip{margin-left:0; flex-basis:100%; font-size:8.5px; padding:2px 5px 1px; text-align:center}
  .enfr{grid-template-columns:1fr auto; grid-template-rows:auto auto; gap:2px 7px}
  .eq{font-size:11.5px; line-height:1.15}
  .eq:first-child{grid-column:1; grid-row:1}
  .eq:last-child{grid-column:1; grid-row:2; text-align:left}
  .marc{grid-column:2; grid-row:1 / 3; align-self:center; padding:2px 6px}
  .marc .n{font-size:17px}
  .marc .pend{font-size:10px}
  .match > footer{padding-top:6px}
  .hset{font-size:12px} .hpend{font-size:11px} .gol{font-size:11px}
  .prox .jbig{font-size:34px}
  .clas td{font-size:12.5px; padding:5px 4px}
  .clas th.equipo, .clas td.equipo{font-size:12px; padding-left:7px}
}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<script>
const ORIGEN = "__PON_AQUI_LA_URL_DE_TU_DATOS_JSON__";

const DIAS = ["lun","mar","mié","jue","vie","sáb","dom"];
const DIAS_L = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const MESES = ["","Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const MES_C = ["","ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fecha = s => { const [a,m,d] = s.split("-").map(Number); return new Date(a, m-1, d); };
const jugado = p => typeof p.gf === "number" && typeof p.gc === "number";

function resultado(p){
  if (!jugado(p)) return null;
  return p.gf > p.gc ? "g" : (p.gf === p.gc ? "e" : "p");
}

function tarjeta(p, mi){
  const f = fecha(p.fecha);
  const r = resultado(p);
  const clases = "match" + (r ? " jugado " + r : "");
  const casa = p.local ? mi : p.rival;
  const visi = p.local ? p.rival : mi;
  let marcador;
  if (r){
    const a = p.local ? p.gf : p.gc, b = p.local ? p.gc : p.gf;
    marcador = `<span class="n">${a}</span><span class="sep">–</span><span class="n">${b}</span>`;
  } else {
    marcador = `<span class="pend">vs</span>`;
  }
  const chip = p.local
    ? `<span class="chip casa">Román Valero</span>`
    : `<span class="chip fuera">A domicilio</span>`;
  const hora = p.hora
    ? `<span class="hset">${esc(p.hora)}</span>`
    : `<span class="hpend">Hora sin designar</span>`;
  const gol = p.goles ? `<p class="gol">${esc(p.goles)}</p>` : "";
  return `<article class="${clases}">
  <header><span class="jn">J${p.j}</span><span class="fch">${DIAS[(f.getDay()+6)%7]} ${f.getDate()} ${MES_C[f.getMonth()+1]}</span>${chip}</header>
  <div class="enfr">
    <span class="eq${p.local ? " mio" : ""}">${esc(casa)}</span>
    <span class="marc">${marcador}</span>
    <span class="eq${p.local ? "" : " mio"}">${esc(visi)}</span>
  </div>
  <footer>${hora}${gol}</footer>
</article>`;
}

function bloqueVuelta(titulo, lista, mi){
  let html = `<section class="vuelta"><h2 class="vt">${titulo}</h2>\n<div class="grid">\n`;
  let mesActual = null;
  for (const p of lista){
    const f = fecha(p.fecha);
    const clave = f.getFullYear() + "-" + f.getMonth();
    if (clave !== mesActual){
      mesActual = clave;
      html += `<h3 class="mes">${MESES[f.getMonth()+1]} <span>${f.getFullYear()}</span></h3>\n`;
    }
    html += tarjeta(p, mi) + "\n";
  }
  return html + "</div></section>";
}

function pinta(d){
  const mi = "Moscardó";
  const partidos = d.partidos.slice().sort((a,b) => a.j - b.j);

  // --- Clasificación ---
  let filas = "";
  (d.clasificacion || []).forEach((t, i) => {
    const pos = i + 1;
    const dg = t.gf - t.gc;
    const zona = pos === 1 ? "asc" : (pos <= 5 ? "po" : "");
    const mio = /Moscard/i.test(t.equipo) ? " mio" : "";
    filas += `<tr class="${zona}${mio}"><td class="pos">${pos}</td><td class="equipo">${esc(t.equipo)}</td>`
          +  `<td class="pt">${t.pts}</td><td>${t.pj}</td><td>${t.g}</td><td>${t.e}</td><td>${t.p}</td>`
          +  `<td>${t.gf}</td><td>${t.gc}</td><td class="dg">${dg > 0 ? "+" + dg : dg}</td></tr>\n`;
  });
  const clas = filas ? `<section class="clas">
  <h2 class="vt vt-clas">Clasificación</h2>
  <div class="clas-wrap"><table>
    <thead><tr><th class="pos">#</th><th class="equipo">Equipo</th><th class="pt">Pts</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th class="dg">DG</th></tr></thead>
    <tbody>\n${filas}</tbody>
  </table></div>
  <p class="leyenda"><span class="key asc"></span> Ascenso directo <span class="key po"></span> Promoción de ascenso</p>
</section>` : "";

  // --- Próximo partido ---
  const prox = partidos.find(p => !jugado(p));
  let bloqueProx = "";
  if (prox){
    const f = fecha(prox.fecha);
    const donde = prox.local ? "en el Román Valero" : "a domicilio";
    const hora = prox.hora ? prox.hora : "horario sin designar";
    bloqueProx = `<div class="prox">
    <div class="tag">Próximo partido</div>
    <div class="cuerpo">
      <div class="jbig">J${prox.j}</div>
      <div class="quien">
        <b>${esc(prox.rival)}</b>
        <span>${DIAS_L[(f.getDay()+6)%7]} ${f.getDate()} de ${MESES[f.getMonth()+1].toLowerCase()} · ${donde} · ${esc(hora)}</span>
      </div>
    </div>
  </div>`;
  }

  // --- Marcador de temporada y racha ---
  let pj=0,g=0,e=0,p_=0,gf=0,gc=0; const racha=[];
  for (const p of partidos){
    if (!jugado(p)) continue;
    pj++; gf += p.gf; gc += p.gc;
    const r = resultado(p);
    if (r === "g") g++; else if (r === "e") e++; else p_++;
    racha.push(r);
  }
  const pts = g*3 + e;
  const stats = `<dl class="stats">
    <div><dt>PJ</dt><dd>${pj}</dd></div>
    <div><dt>G</dt><dd>${g}</dd></div>
    <div><dt>E</dt><dd>${e}</dd></div>
    <div><dt>P</dt><dd>${p_}</dd></div>
    <div><dt>GF</dt><dd>${gf}</dd></div>
    <div><dt>GC</dt><dd>${gc}</dd></div>
    <div><dt>Puntos</dt><dd>${pts}</dd></div>
  </dl>`;
  const ult = racha.slice(-5);
  const puntos = ult.map(r => `<span class="dot ${r}"></span>`).join("")
    + Array(Math.max(0, 5 - ult.length)).fill('<span class="dot vac"></span>').join("");
  const bloqueRacha = `<div class="racha"><span class="lab">Racha</span>${puntos}</div>`;

  // --- Pie ---
  const notas = (d.notas || []).map(n => `<p><b>${esc(n[0])}</b> ${esc(n[1])}</p>`).join("\n");
  const pie = `<div class="pie">
${notas}
    <p>Actualizado el ${esc(d.actualizado || "")}${d.tras ? ", " + esc(d.tras) : ""}. Fuente: calendario oficial de la RFFM y actas de la competición.</p>
  </div>`;

  const primera = partidos.filter(p => p.j <= 17);
  const segunda = partidos.filter(p => p.j > 17);

  document.getElementById("app").innerHTML =
    clas + bloqueProx + stats + bloqueRacha
    + bloqueVuelta("Primera vuelta", primera, mi)
    + bloqueVuelta("Segunda vuelta", segunda, mi)
    + pie;

  // Wix no ajusta la altura solo: se la comunicamos a la página madre.
  avisarAltura();
}

function avisarAltura(){
  const h = document.documentElement.scrollHeight;
  try { window.parent.postMessage({tipo:"altura-calendario", altura:h}, "*"); } catch(e){}
}
window.addEventListener("resize", avisarAltura);

function error(msg){
  document.getElementById("app").innerHTML =
    `<div class="pie"><p><b>No se han podido cargar los datos.</b> ${esc(msg)}</p></div>`;
}

(async () => {
  try {
    const r = await fetch(ORIGEN + (ORIGEN.includes("?") ? "&" : "?") + "v=" + Date.now(), {cache:"no-store"});
    if (!r.ok) throw new Error("El servidor respondió " + r.status);
    pinta(await r.json());
  } catch (e){
    error(e.message);
  }
})();
</script>
</body></html>
